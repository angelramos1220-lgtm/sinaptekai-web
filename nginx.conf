# nginx del sitio (imagen final del Dockerfile). Sirve el contenido estático de dist/.
#
# Las cabeceras se deciden aquí arriba con "map" y se agregan una sola vez, en el
# bloque server. NO poner add_header dentro de un "location": en nginx eso anula
# todas las cabeceras heredadas del server para ese location.

# --- Versión Markdown para quien la pide -------------------------------------
# Un asistente de IA que envía "Accept: text/markdown" recibe el .md de la página
# (/casos -> /casos.md, / -> /index.md). El resto recibe el HTML de siempre.
map $http_accept $ext {
    default            ".html";
    "~*text/markdown"  ".md";
}

# Páginas que tienen versión Markdown (las genera src/lib/markdown.ts).
# Si se agrega una página con .md fuera de estas rutas, sumarla aquí.
map $uri $pagina_md {
    default                                                              "";
    "~^/index\.(?:html|md)$"                                             "/index.md";
    "~^(?<base>/(?:casos|precios|servicios/[a-z0-9-]+))\.(?:html|md)$"   "${base}.md";
}
# En esas páginas la respuesta depende de la cabecera Accept: hay que avisarlo a
# las cachés (Vary) y anunciar la alternativa (Link).
map $pagina_md $vary_accept {
    default  "Accept";
    ""       "";
}
map $pagina_md $link_md {
    default  "<$pagina_md>; rel=\"alternate\"; type=\"text/markdown\"";
    ""       "";
}

# --- Modo de prueba: todo lo que no sea el dominio real -----------------------
# La misma imagen sirve el sitio real y el de prueba. Producción es SOLO
# synaptekai.tech y www.synaptekai.tech. Con cualquier otro nombre
# (nuevo.synaptekai.tech, un dominio *.easypanel.host, una IP, localhost) todo sale
# con "noindex" y robots.txt prohíbe el rastreo: una copia del sitio nunca compite
# con el real en Google. (La franja "Sitio de prueba" la pone la página: Base.astro,
# con la misma regla y la misma lista: negocio.dominiosProduccion.)
map $host $sitio_prueba {
    default              1;
    synaptekai.tech      0;
    www.synaptekai.tech  0;
}
map $sitio_prueba $x_robots {
    0  "";
    1  "noindex, nofollow";
}
map $sitio_prueba $robots_archivo {
    0  /robots.txt;
    1  /robots-prueba.txt;
}

# --- Caché -------------------------------------------------------------------
# /_astro/ lleva un hash en el nombre: si el contenido cambia, cambia el nombre.
# Se puede guardar un año. El HTML, los .md y los .txt se revalidan siempre.
map $uri $cache_control {
    default      "no-cache";
    "~^/_astro/" "public, max-age=31536000, immutable";
    "~^/assets/" "public, max-age=86400";
}

# --- Compresión --------------------------------------------------------------
# text/html se comprime siempre; el resto de tipos va en gzip_types.
# gzip_proxied any: Easypanel sirve el sitio detrás de un proxy, y sin esto nginx
# no comprime las peticiones que llegan por ahí.
gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types text/css application/javascript application/json image/svg+xml text/plain text/markdown text/xml application/xml;

# Declara UTF-8 en los archivos de texto (los .md y llms.txt llevan tildes y ñ).
charset utf-8;
charset_types text/plain text/markdown text/css application/javascript text/xml application/xml;

server_tokens off;

# www -> dominio sin www (301, conserva ruta y parámetros).
server {
    listen 80;
    server_name www.synaptekai.tech;
    return 301 https://synaptekai.tech$request_uri;
}

server {
    listen 80 default_server;
    # default_server: también atiende cualquier otro nombre (en modo de prueba).
    server_name synaptekai.tech;
    root /usr/share/nginx/html;
    index index.html;
    # Las redirecciones salen relativas: detrás del proxy nginx no sabe que es https.
    absolute_redirect off;

    # .md no está en la lista de tipos de nginx.
    include /etc/nginx/mime.types;
    types { text/markdown md; }

    # Cabeceras de todas las respuestas. Una variable vacía no envía su cabecera.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control $cache_control always;
    add_header X-Robots-Tag $x_robots always;
    add_header Vary $vary_accept always;
    add_header Link $link_md always;

    error_page 404 /404.html;

    # Portada: HTML, o Markdown si lo piden.
    location = / {
        try_files /index$ext /index.html =404;
    }

    # URLs sin extensión, sin redirección: /privacidad sirve privacidad.html.
    # Orden: el archivo tal cual (assets, .md, .html) · la página en el formato
    # pedido · la página en HTML (las que no tienen .md, como /privacidad).
    location / {
        rewrite ^/(.+)/$ /$1 permanent;
        try_files $uri $uri$ext $uri.html =404;
    }

    # robots.txt: el real solo en el dominio real; en cualquier otro, el de prueba.
    location = /robots.txt {
        try_files $robots_archivo =404;
    }
    location = /robots-prueba.txt {
        internal;
    }

    # La página 404 solo se entrega como respuesta de error, con código 404.
    location = /404.html {
        internal;
    }
    location = /404 {
        return 404;
    }
}
