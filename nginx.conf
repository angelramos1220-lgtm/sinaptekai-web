map $http_accept $wants_markdown {
    default 0;
    "~*text/markdown" 1;
}

server {
    listen 80;
    server_name www.synaptekai.tech;
    return 301 https://synaptekai.tech$request_uri;
}

server {
    listen 80 default_server;
    server_name synaptekai.tech;
    root /usr/share/nginx/html;
    index index.html;

    location = /index.md {
        default_type text/markdown;
    }

    location = / {
        add_header Link '</index.md>; rel="alternate"; type="text/markdown"' always;
        if ($wants_markdown) {
            rewrite ^ /index.md last;
        }
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
