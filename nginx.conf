map $http_accept $wants_markdown {
    default 0;
    "~*text/markdown" 1;
}

# Compresión. text/html se comprime siempre; el resto de tipos va en gzip_types.
# gzip_proxied any: Easypanel sirve el sitio detrás de un proxy, y sin esto nginx
# no comprime las peticiones que llegan por ahí.
gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types text/css application/javascript application/json image/svg+xml text/plain text/markdown;

# Declara UTF-8 en los archivos de texto (llms.txt e index.md llevan tildes y ñ).
charset utf-8;
charset_types text/plain text/markdown;

server {
    listen 80;
    server_name www.synaptekai.tech;
    return 301 https://synaptekai.tech$request_uri;
}

server {
    listen 80 default_server;
    server_name synaptekai.tech;
    root /usr/share/nginx/html;
    index index.html;

    location = /index.md {
        default_type text/markdown;
    }

    location = / {
        add_header Link '</index.md>; rel="alternate"; type="text/markdown"' always;
        if ($wants_markdown) {
            rewrite ^ /index.md last;
        }
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
