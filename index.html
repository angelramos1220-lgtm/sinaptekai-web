  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

nt-face {\n  font-family: \u0027Space Grotesk\u0027;\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"cb875430-df99-4a20-b8ca-9abb3ce2fbeb\") format(\u0027woff2\u0027);\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: \u0027Space Grotesk\u0027;\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"ae499c03-99c9-4b7e-90cc-b94b37580340\") format(\u0027woff2\u0027);\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: \u0027Space Grotesk\u0027;\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"ea57cdbd-7cb7-4c6c-9676-fdda8199898e\") format(\u0027woff2\u0027);\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: \u0027Space Grotesk\u0027;\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"cb875430-df99-4a20-b8ca-9abb3ce2fbeb\") format(\u0027woff2\u0027);\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\u003c/style\u003e\n\u003clink rel=\"icon\" href=\"/assets/favicon.ico\" sizes=\"any\"\u003e\n\u003clink rel=\"icon\" type=\"image/png\" sizes=\"512x512\" href=\"/assets/favicon-512x512.png\"\u003e\n\u003clink rel=\"icon\" type=\"image/png\" sizes=\"192x192\" href=\"/assets/favicon-192x192.png\"\u003e\n\u003clink rel=\"icon\" type=\"image/png\" sizes=\"96x96\" href=\"/assets/favicon-96x96.png\"\u003e\n\u003clink rel=\"icon\" type=\"image/png\" sizes=\"48x48\" href=\"/assets/favicon-48x48.png\"\u003e\n\u003clink rel=\"apple-touch-icon\" href=\"/assets/apple-touch-icon.png\"\u003e\n\u003cstyle\u003e\n  body { margin: 0; background: #0B0F19; font-family: \u0027Manrope\u0027, sans-serif; }\n  a { color: #06B6D4; text-decoration: none; }\n  a:hover { color: #4F46E5; }\n  /* ============================================================\n     Tarjetas 3D reactivas — reemplaza al anillo giratorio.\n     Filosofía: nada se anima sola en reposo; todo reacciona al cursor.\n     El ángulo del borde y la posición del resplandor los actualiza JS vía\n     variables CSS (--tilt-x/--tilt-y/--tilt-z/--mx/--my/--border-angle);\n     mientras la tarjeta está activa, transition:none para que el\n     seguimiento sea instantáneo — el único momento en que SÍ transiciona\n     es al soltar el cursor (vuelta a reposo) y en la entrada escalonada.\n     ============================================================ */\n  [data-tilt-grid] { perspective: 1000px; }\n  .tilt-card {\n    --tilt-x: 0deg; --tilt-y: 0deg; --tilt-z: 0px;\n    --mx: 50%; --my: 50%; --shadow-x: 0px; --shadow-y: 0px;\n    --border-angle: 0deg;\n    --card-fill: rgba(15,23,42,0.78);\n    position: relative;\n    /* Con fallback visible: si el JS no llegara a correr, la tarjeta se ve\n       igual (opacidad 1, sin desplazamiento) en vez de quedar invisible\n       para siempre — el estado oculto de la entrada lo aplica el JS mismo,\n       justo antes de observar, no el CSS por defecto. */\n    opacity: var(--enter-o, 1);\n    transform-style: preserve-3d;\n    transform: translateY(var(--enter-y, 0px)) rotateX(var(--tilt-x)) rotateY(var(--tilt-y)) translateZ(var(--tilt-z));\n    transition: opacity .5s ease, transform .42s cubic-bezier(.22,1,.36,1), box-shadow .3s ease;\n    border: 1px solid transparent;\n    background:\n      linear-gradient(var(--card-fill), var(--card-fill)) padding-box,\n      linear-gradient(rgba(148,163,184,0.18), rgba(148,163,184,0.18)) border-box;\n    backdrop-filter: blur(14px) saturate(150%);\n    -webkit-backdrop-filter: blur(14px) saturate(150%);\n  }\n  .tilt-card.tc-in { --enter-y: 0px; --enter-o: 1; }\n  .tilt-card \u003e * { position: relative; z-index: 1; }\n  .tilt-card::after {\n    content: \u0027\u0027; position: absolute; inset: 0; border-radius: inherit; z-index: 0;\n    pointer-events: none; opacity: 0; transition: opacity .3s ease;\n    background: radial-gradient(circle at var(--mx) var(--my), rgba(99,102,241,0.18), transparent 60%);\n  }\n  .tilt-card.is-active {\n    transition: none;\n    box-shadow: 0 22px 50px -12px var(--hover-glow, rgba(99,102,241,0.25));\n    background:\n      linear-gradient(var(--card-fill), var(--card-fill)) padding-box,\n      conic-gradient(from var(--border-angle),\n        rgba(99,102,241,0.85) 0deg, rgba(139,92,246,0.45) 70deg,\n        rgba(45,212,191,0.12) 150deg, rgba(45,212,191,0.12) 210deg,\n        rgba(139,92,246,0.45) 290deg, rgba(99,102,241,0.85) 360deg\n      ) border-box;\n  }\n  .tilt-card.is-active::after { opacity: 1; }\n  /* Variante clara (Servicios, Casos de éxito): un glow sobre blanco no se\n     ve, así que en vez de resplandor uso una sombra suave que sigue al\n     cursor. Fondo ya opaco de por sí — sin backdrop-filter, no hace falta. */\n  .tilt-card--light { --card-fill: #ffffff; backdrop-filter: none; -webkit-backdrop-filter: none; }\n  .tilt-card--light::after { display: none; }\n  .tilt-card--light.is-active {\n    box-shadow: var(--shadow-x) var(--shadow-y) 32px rgba(15,23,42,0.14), 0 20px 45px -14px var(--hover-glow, rgba(79,70,229,0.15));\n  }\n  /* Variante rosa (promo de Diseño Web): misma reactividad, paleta propia\n     para no chocar con la identidad rosa/magenta de esa tarjeta. */\n  .tilt-card--pink { --card-fill: rgba(40,16,30,0.82); }\n  .tilt-card--pink {\n    background:\n      linear-gradient(var(--card-fill), var(--card-fill)) padding-box,\n      linear-gradient(rgba(244,114,182,0.28), rgba(244,114,182,0.28)) border-box;\n  }\n  .tilt-card--pink::after {\n    background: radial-gradient(circle at var(--mx) var(--my), rgba(236,72,153,0.20), transparent 60%);\n  }\n  .tilt-card--pink.is-active {\n    box-shadow: 0 22px 50px -12px rgba(236,72,153,0.28);\n    background:\n      linear-gradient(var(--card-fill), var(--card-fill)) padding-box,\n      conic-gradient(from var(--border-angle),\n        rgba(236,72,153,0.85) 0deg, rgba(244,114,182,0.45) 70deg,\n        rgba(236,72,153,0.12) 150deg, rgba(236,72,153,0.12) 210deg,\n        rgba(244,114,182,0.45) 290deg, rgba(236,72,153,0.85) 360deg\n      ) border-box;\n  }\n  /* \"Recomendado\": distinción permanente pero sin animarse sola — borde en\n     reposo más marcado, nada más. Reacciona igual que el resto al pasar el\n     cursor (misma paleta índigo/violeta/teal de .is-active). */\n  .tilt-card--featured {\n    background:\n      linear-gradient(var(--card-fill), var(--card-fill)) padding-box,\n      linear-gradient(rgba(129,140,248,0.45), rgba(129,140,248,0.45)) border-box;\n  }\n  .site-header { padding: 18px 48px; }\n  .hero-section { padding: 96px 48px 120px; }\n  .hero-content { gap: 24px; }\n  .desktop-nav, .desktop-actions { display: flex; }\n  .mobile-actions { display: none; align-items: center; gap: 8px; }\n  .mobile-wa-btn {\n    display: flex; align-items: center; justify-content: center;\n    width: 44px; height: 44px; border-radius: 12px; background: #25D366; flex-shrink: 0;\n  }\n  .mobile-wa-btn:hover { background: #1FBE5C; }\n  .mobile-wa-btn:focus-visible { outline: 3px solid #67E8F9; outline-offset: 2px; }\n  .mobile-nav-toggle {\n    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;\n    width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,0.06);\n    border: 1px solid #1E293B; cursor: pointer; flex-shrink: 0;\n  }\n  .mobile-nav-toggle:fo : [\u0027asistente\u0027, \u0027chatbot\u0027, \u0027bot\u0027, \u0027agente virtual\u0027, \u0027ia\u0027] },\n    { id: \u0027automatizacion\u0027, nombre: \u0027Automatización de Procesos\u0027, desc: \u0027Conectamos tus herramientas para que las tareas repetitivas —reportes, seguimientos, alertas— corran solas.\u0027, precio: \u0027Depende del proceso — cuéntame cuál y lo cotizamos\u0027, kws: [\u0027automatiz\u0027, \u0027proceso\u0027, \u0027flujo\u0027, \u0027n8n\u0027, \u0027integra\u0027] },\n    { id: \u0027redes\u0027, nombre: \u0027Gestión de Redes\u0027, desc: \u0027Programación y publicación automática de contenido en tus redes. Los recordatorios automáticos y el reporte mensual están en Crecimiento 360°.\u0027, precio: \u0027Desde S/400 instalación + S/80/mes\u0027, kws: [\u0027redes\u0027, \u0027instagram\u0027, \u0027facebook\u0027, \u0027contenido\u0027, \u0027publicacion\u0027, \u0027publicaciones\u0027] },\n    { id: \u0027videos\u0027, nombre: \u0027Videos con IA\u0027, desc: \u0027Videos generados con IA para tus redes o demos de producto, sin cámara ni edición manual.\u0027, precio: \u0027Desde S/500 instalación + S/80/mes\u0027, kws: [\u0027video\u0027, \u0027videos\u0027] },\n    { id: \u0027inventario\u0027, nombre: \u0027Inventario + Boletas\u0027, desc: \u0027Control de stock y emisión de boletas electrónicas por WhatsApp, todo en un solo flujo.\u0027, precio: \u0027Desde S/700 instalación + S/100/mes\u0027, kws: [\u0027inventario\u0027, \u0027boleta\u0027, \u0027boletas\u0027, \u0027stock\u0027, \u0027venta\u0027] }\n  ];\n\n  var root = document.getElementById(\u0027sk-chat-root\u0027);\n  var launcher = document.getElementById(\u0027sk-launcher\u0027);\n  var panelWrap = document.getElementById(\u0027sk-panel-wrap\u0027);\n  var panel = document.getElementById(\u0027sk-panel\u0027);\n  var closeBtn = document.getElementById(\u0027sk-close\u0027);\n  var headerWa = document.getElementById(\u0027sk-header-wa\u0027);\n  var log = document.getElementById(\u0027sk-log\u0027);\n  var chips = document.getElementById(\u0027sk-chips\u0027);\n  var form = document.getElementById(\u0027sk-form\u0027);\n  var input = document.getElementById(\u0027sk-input\u0027);\n\n  var state = {\n    sessionId: (window.crypto \u0026\u0026 crypto.randomUUID) ? crypto.randomUUID() : (\u0027sk-\u0027 + Date.now() + \u0027-\u0027 + Math.random().toString(36).slice(2)),\n    mensajes: [],\n    servicioElegido: null,\n    sent: false,\n    inactivityTimer: null,\n    lastFocused: null\n  };\n\n  function esc(s) {\n    var d = document.createElement(\u0027div\u0027);\n    d.textContent = (s === null || s === undefined) ? \u0027\u0027 : String(s);\n    return d.innerHTML;\n  }\n\n  function waLink(mensaje) {\n    return \u0027https://wa.me/\u0027 + WHATSAPP_NUMBER + \u0027?text=\u0027 + encodeURIComponent(mensaje);\n  }\n\n  headerWa.href = waLink(\u0027Hola, quiero saber más sobre los servicios de SynaptekAI\u0027);\n\n  function addMsg(from, html) {\n    var plain = html.replace(/\u003c[^\u003e]+\u003e/g, \u0027 \u0027).replace(/\\s+/g, \u0027 \u0027).trim();\n    state.mensajes.push({ from: from, text: plain, ts: new Date().toISOString() });\n    var el = document.createElement(\u0027div\u0027);\n    el.className = \u0027sk-msg sk-msg-\u0027 + from;\n    el.innerHTML = html;\n    log.appendChild(el);\n    log.scrollTop = log.scrollHeight;\n    resetInactivityTimer();\n  }\n\n  function renderServicio(servicio) {\n    state.servicioElegido = servicio.id;\n    var mensajePrefijado = \u0027Hola, me interesa el servicio de \u0027 + servicio.nombre;\n    var precioHtml = servicio.precio ? \u0027\u003cp class=\"sk-precio\"\u003e\u0027 + esc(servicio.precio) + \u0027\u003c/p\u003e\u0027 : \u0027\u0027;\n    var calendlyHtml = CALENDLY_URL ? \u0027\u003ca class=\"sk-btn sk-btn-secondary\" href=\"\u0027 + CALENDLY_URL + \u0027\" target=\"_blank\" rel=\"noopener\"\u003eAgendar demo gratis\u003c/a\u003e\u0027 : \u0027\u0027;\n    var html = \u0027\u003cp\u003e\u0027 + esc(servicio.desc) + \u0027\u003c/p\u003e\u0027 +\n      precioHtml +\n      \u0027\u003cdiv class=\"sk-actions\"\u003e\u0027 +\n      \u0027\u003ca class=\"sk-btn sk-btn-primary\" href=\"\u0027 + waLink(mensajePrefijado) + \u0027\" target=\"_blank\" rel=\"noopener\"\u003eHablar por WhatsApp\u003c/a\u003e\u0027 +\n      calendlyHtml +\n      \u0027\u003c/div\u003e\u0027;\n    addMsg(\u0027bot\u0027, html);\n  }\n\n  function renderFallback() {\n    var html = \u0027\u003cp\u003eEntiendo. Déjame conectarte con una persona. ¿Te escribimos por WhatsApp?\u003c/p\u003e\u0027 +\n      \u0027\u003cdiv class=\"sk-actions\"\u003e\u0027 +\n      \u0027\u003ca class=\"sk-btn sk-btn-primary\" href=\"\u0027 + waLink(\u0027Hola, tengo una consulta para SynaptekAI\u0027) + \u0027\" target=\"_blank\" rel=\"noopener\"\u003eHablar por WhatsApp\u003c/a\u003e\u0027 +\n      \u0027\u003c/div\u003e\u0027;\n    addMsg(\u0027bot\u0027, html);\n  }\n\n  function matchServicio(texto) {\n    var t = texto.toLowerCase();\n    for (var i = 0; i \u003c SERVICIOS.length; i++) {\n      var s = SERVICIOS[i];\n      for (var j = 0; j \u003c s.kws.length; j++) {\n        if (t.indexOf(s.kws[j]) !== -1) return s;\n      }\n    }\n    return null;\n  }\n\n  function handleUserText(texto) {\n    if (!texto.trim()) return;\n    addMsg(\u0027user\u0027, esc(texto));\n    var s = matchServicio(texto);\n    if (s) { renderServicio(s); } else { renderFallback(); }\n  }\n\n  chips.innerHTML = SERVICIOS.map(function (s) {\n    return \u0027\u003cbutton type=\"button\" class=\"sk-chip\" data-id=\"\u0027 + s.id + \u0027\"\u003e\u0027 + esc(s.nombre) + \u0027\u003c/button\u003e\u0027;\n  }).join(\u0027\u0027);\n\n  chips.addEventListener(\u0027click\u0027, function (e) {\n    var btn = e.target.closest(\u0027.sk-chip\u0027);\n    if (!btn) return;\n    var s = SERVICIOS.filter(function (x) { return x.id === btn.getAttribute(\u0027data-id\u0027); })[0];\n    if (!s) return;\n    addMsg(\u0027user\u0027, esc(s.nombre));\n    renderServicio(s);\n  });\n\n  form.addEventListener(\u0027submit\u0027, function (e) {\n    e.preventDefault();\n    var texto = input.value;\n    input.value = \u0027\u0027;\n    handleUserText(texto);\n  });\n\n  function onKeydown(e) {\n    if (e.key === \u0027Escape\u0027) { e.preventDefault(); closePanel(); return; }\n    if (e.key === \u0027Tab\u0027) { trapFocus(e); }\n  }\n\n  function trapFocus(e) {\n    var focusables = panel.querySelectorAll(\u0027button, [href], input, textarea, select, [tabindex]:not([tabindex=\"-1\"])\u0027);\n    if (!focusables.length) return;\n    var first = focusables[0], last = focusables[focusables.length - 1];\n    if (e.shiftKey \u0026\u0026 document.activeElement === first) { e.preventDefault(); last.focus(); }\n    else if (!e.shiftKey \u0026\u0026 document.activeElement === last) { e.preventDefault(); first.focus(); }\n  }\n\n  // Arrastrar el launcher a cualquier posición de la pantalla. Un click normal\n  // (sin desplazamiento) sigue abriendo/cerrando el chat; solo un arrastre real\n  // (más de 6px de movimiento) reposiciona el botón y suprime el click siguiente.\n  var DRAG_POS_KEY = \u0027synaptekai-chat-launcher-pos\u0027;\n  var dragState = { active: false, moved: false, startX: 0, startY: 0, startLeft: 0, startTop: 0 };\n  var launcherWasDragged = false;\n\n  function clamp(val, min, max) { return Math.min(Math.max(val, min), max); }\n\n  function placeLauncher(left, top) {\n    var size = launcher.offsetWidth || 68;\n    var margin = 8;\n    left = clamp(left, margin, window.innerWidth - size - margin);\n    top = clamp(top, margin, window.innerHeight - size - margin);\n    launcher.style.left = left + \u0027px\u0027;\n    launcher.style.top = top + \u0027px\u0027;\n    launcher.style.right = \u0027auto\u0027;\n    launcher.style.bottom = \u0027auto\u0027;\n    launcherWasDragged = true;\n  }\n\n  function saveLauncherPos(left, top) {\n    try { localStorage.setItem(DRAG_POS_KEY, JSON.stringify({ left: left, top: top })); } catch (e) {}\n  }\n\n  (function restoreLauncherPos() {\n    try {\n      var raw = localStorage.getItem(DRAG_POS_KEY);\n      if (!raw) return;\n      var pos = JSON.parse(raw);\n      if (typeof pos.left === \u0027number\u0027 \u0026\u0026 typeof pos.top === \u0027number\u0027) placeLauncher(pos.left, pos.top);\n    } catch (e) {}\n  })();\n\n  launcher.addEventListener(\u0027pointerdown\u0027, function (e) {\n    if (e.pointerType === \u0027mouse\u0027 \u0026\u0026 e.button !== 0) return;\n    dragState.active = true;\n    dragState.moved = false;\n    var rect = launcher.getBoundingClientRect();\n    dragState.startX = e.clientX;\n    dragState.startY = e.clientY;\n    dragState.startLeft = rect.left;\n    dragState.startTop = rect.top;\n    try { launcher.setPointerCapture(e.pointerId); } catch (err) {}\n  });\n\n  launcher.addEventListener(\u0027pointermove\u0027, function (e) {\n    if (!dragState.active) return;\n    var dx = e.clientX - dragState.startX;\n    var dy = e.clientY - dragState.startY;\n    if (!dragState.moved \u0026\u0026 Math.hypot(dx, dy) \u003c 6) return;\n    dragState.moved = true;\n    launcher.classList.add(\u0027sk-dragging\u0027);\n    placeLauncher(dragState.startLeft + dx, dragState.startTop + dy);\n  });\n\n  function endLauncherDrag() {\n    if (!dragState.active) return;\n    dragState.active = false;\n    launcher.classList.remove(\u0027sk-dragging\u0027);\n    if (dragState.moved) {\n      var rect = launcher.getBoundingClientRect();\n      saveLauncherPos(rect.left, rect.top);\n    }\n  }\n  launcher.addEventListener(\u0027pointerup\u0027, endLauncherDrag);\n  launcher.addEventListener(\u0027pointercancel\u0027, endLauncherDrag);\n\n  window.addEventListener(\u0027resize\u0027, function () {\n    if (!launcherWasDragged) return;\n    var rect = launcher.getBoundingClientRect();\n    placeLauncher(rect.left, rect.top);\n  });\n\n  // Cuando el launcher fue movido, el panel se abre junto a su posición actual\n  // en vez del rincón fijo de siempre (en móvil el panel ya ocupa toda la\n  // pantalla, así que ahí no hace falta calcular nada).\n  function positionPanelNearLauncher() {\n    if (!launcherWasDragged || window.innerWidth \u003c 768) {\n      panelWrap.style.left = \u0027\u0027;\n      panelWrap.style.top = \u0027\u0027;\n      panelWrap.style.right = \u0027\u0027;\n      panelWrap.style.bottom = \u0027\u0027;\n      return;\n    }\n    var r = launcher.getBoundingClientRect();\n    var panelW = Math.min(380, window.innerWidth - 40);\n    var panelH = Math.min(600, window.innerHeight - 120);\n    var margin = 12;\n    var left = clamp(r.right - panelW, margin, window.innerWidth - panelW - margin);\n    var top = r.top - panelH - margin;\n    if (top \u003c margin) top = r.bottom + margin;\n    top = clamp(top, margin, window.innerHeight - panelH - margin);\n    panelWrap.style.left = left + \u0027px\u0027;\n    panelWrap.style.top = top + \u0027px\u0027;\n    panelWrap.style.right = \u0027auto\u0027;\n    panelWrap.style.bottom = \u0027auto\u0027;\n  }\n\n  function openPanel() {\n    try { sessionStorage.setItem(\u0027synaptekai-chat-opened-session\u0027, \u00271\u0027); } catch (e) {}\n    state.lastFocused = document.activeElement;\n    positionPanelNearLauncher();\n    panelWrap.hidden = false;\n    launcher.setAttribute(\u0027aria-expanded\u0027, \u0027true\u0027);\n    document.addEventListener(\u0027keydown\u0027, onKeydown, true);\n    if (log.children.length === 0) {\n      addMsg(\u0027bot\u0027, \u0027\u003cp\u003e¡Hola! Soy el asistente de SynaptekAI.\u003cbr\u003e¿Qué te gustaría automatizar?\u003c/p\u003e\u0027);\n    }\n    setTimeout(function () { input.focus(); }, 0);\n    resetInactivityTimer();\n  }\n\n  function closePanel() {\n    if (panelWrap.hidden) return;\n    panelWrap.hidden = true;\n    launcher.setAttribute(\u0027aria-expanded\u0027, \u0027false\u0027);\n    document.removeEventListener(\u0027keydown\u0027, onKeydown, true);\n    clearTimeout(state.inactivityTimer);\n    if (state.lastFocused \u0026\u0026 typeof state.lastFocused.focus === \u0027function\u0027) state.lastFocused.focus();\n    sendPayload(false);\n  }\n\n  launcher.addEventListener(\u0027click\u0027, function () {\n    if (dragState.moved) { dragState.moved = false; return; }\n    if (panelWrap.hidden) openPanel(); else closePanel();\n  });\n  closeBtn.addEventListener(\u0027click\u0027, closePanel);\n\n  function resetInactivityTimer() {\n    clearTimeout(state.inactivityTimer);\n    state.inactivityTimer = setTimeout(function () { sendPayload(false); }, 60000);\n  }\n\n  function buildPayload() {\n    return {\n      timestamp: new Date().toISOString(),\n      sessionId: state.sessionId,\n      servicioElegido: state.servicioElegido,\n      mensajes: state.mensajes,\n      userAgent: navigator.userAgent,\n      referrer: document.referrer || null,\n      paginaOrigen: location.href\n    };\n  }\n\n  function sendPayload(useBeacon) {\n    if (state.sent) return;\n    if (state.mensajes.length \u003c= 1) return; // solo el saludo inicial: nada que reportar\n    state.sent = true;\n    var payload = JSON.stringify(buildPayload());\n    try {\n      if (useBeacon \u0026\u0026 navigator.sendBeacon) {\n        var blob = new Blob([payload], { type: \u0027application/json\u0027 });\n        navigator.sendBeacon(WEBHOOK_URL, blob);\n        return;\n      }\n      fetch(WEBHOOK_URL, { method: \u0027POST\u0027, headers: { \u0027Content-Type\u0027: \u0027application/json\u0027 }, body: payload, keepalive: true })\n        .catch(function () { /* silencioso: el chat sigue funcionando igual si falla */ });\n    } catch (err) { /* nunca romper el widget por un fallo de red */ }\n  }\n\n  document.addEventListener(\u0027visibilitychange\u0027, function () {\n    if (document.visibilityState === \u0027hidden\u0027 \u0026\u0026 !panelWrap.hidden) sendPayload(true);\n  });\n  window.addEventListener(\u0027pagehide\u0027, function () {\n    if (!panelWrap.hidden) sendPayload(true);\n  });\n\n  // ============================================================\n  // Saludo inicial del launcher — una sola vez por sesión.\n  // ============================================================\n  (function initLauncherGreeting() {\n    var GREET_KEY = \u0027synaptekai-chat-greeted-session\u0027;\n    var OPENED_KEY = \u0027synaptekai-chat-opened-session\u0027;\n    try {\n      if (sessionStorage.getItem(GREET_KEY)) return;\n      if (sessionStorage.getItem(OPENED_KEY)) return;\n    } catch (e) { return; } // sin sessionStorage disponible: no arriesgar a saludar de más\n\n    var reduced = window.matchMedia(\u0027(prefers-reduced-motion: reduce)\u0027).matches;\n    var bubble = document.getElementById(\u0027sk-greet-bubble\u0027);\n    var dismissTimer = null;\n    var greeted = false;\n\n    function markGreeted() {\n      if (greeted) return;\n      greeted = true;\n      try { sessionStorage.setItem(GREET_KEY, \u00271\u0027); } catch (e) {}\n    }\n\n    function onOutsideInteraction(e) {\n      if (e.type === \u0027click\u0027 \u0026\u0026 bubble \u0026\u0026 (e.target === bubble || bubble.contains(e.target))) return;\n      hideBubble();\n    }\n\n    function hideBubble() {\n      if (!bubble || bubble.hidden) return;\n      bubble.classList.remove(\u0027sk-greet-visible\u0027);\n      clearTimeout(dismissTimer);\n      setTimeout(function () { bubble.hidden = true; }, reduced ? 0 : 400);\n      document.removeEventListener(\u0027click\u0027, onOutsideInteraction, true);\n      window.removeEventListener(\u0027scroll\u0027, onOutsideInteraction);\n    }\n\n    function stopGreetAnimations() {\n      launcher.classList.remove(\u0027sk-greet-hop\u0027, \u0027sk-greet-pulse\u0027, \u0027sk-greet-breathe\u0027);\n    }\n\n    function showBubble() {\n      if (!bubble) return;\n      var isMobile = window.innerWidth \u003c 768;\n      var above = isMobile; // en móvil SIEMPRE arriba del launcher, nunca a la izquierda\n      if (!above) {\n        var available = window.innerWidth - (20 + 68 + 16);\n        above = available \u003c 200;\n      }\n      bubble.classList.toggle(\u0027sk-greet-above\u0027, above);\n      bubble.hidden = false;\n\n      // Chequeo real contra los botones del hero antes de mostrarla — se\n      // mide, no se adivina. Si tapa alguno, mejor no mostrarla esa vez.\n      var heroSection = document.getElementById(\u0027inicio\u0027);\n      if (heroSection) {\n        var heroRect = heroSection.getBoundingClientRect();\n        if (heroRect.bottom \u003e 0 \u0026\u0026 heroRect.top \u003c window.innerHeight) {\n          var bubbleRect = bubble.getBoundingClientRect();\n          var ctas = heroSection.querySelectorAll(\u0027a\u0027);\n          for (var i = 0; i \u003c ctas.length; i++) {\n            var r = ctas[i].getBoundingClientRect();\n            var overlap = !(bubbleRect.right \u003c r.left || bubbleRect.left \u003e r.right || bubbleRect.bottom \u003c r.top || bubbleRect.top \u003e r.bottom);\n            if (overlap) { bubble.hidden = true; return; }\n          }\n        }\n      }\n\n      requestAnimationFrame(function () { bubble.classList.add(\u0027sk-greet-visible\u0027); });\n      document.addEventListener(\u0027click\u0027, onOutsideInteraction, true);\n      window.addEventListener(\u0027scroll\u0027, onOutsideInteraction, { passive: true });\n      dismissTimer = setTimeout(hideBubble, 6000);\n    }\n\n    function runGreeting() {\n      if (!panelWrap.hidden) return; // el chat ya está abierto: no saludar encima\n      markGreeted();\n      if (!reduced) {\n        launcher.classList.add(\u0027sk-greet-hop\u0027, \u0027sk-greet-pulse\u0027);\n        setTimeout(function () {\n          launcher.classList.remove(\u0027sk-greet-hop\u0027, \u0027sk-greet-pulse\u0027);\n          launcher.classList.add(\u0027sk-greet-breathe\u0027);\n        }, 1300);\n      }\n      showBubble();\n    }\n\n    launcher.addEventListener(\u0027mouseenter\u0027, stopGreetAnimations);\n    if (bubble) {\n      bubble.addEventListener(\u0027click\u0027, function () {\n        hideBubble();\n        openPanel();\n      });\n    }\n\n    setTimeout(runGreeting, 3000);\n  })();\n})();\n\u003c/script\u003e\n\n\u003c/body\u003e\u003c/html\u003e"
